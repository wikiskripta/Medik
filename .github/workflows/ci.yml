name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ "*" ]

jobs:
  test:
    name: "PHPUnit: MW ${{ matrix.mw }}, PHP ${{ matrix.php }}"
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - mw: 'REL1_43'
            php: 8.1
            experimental: false
          - mw: 'REL1_44'
            php: 8.2
            experimental: false
          - mw: 'REL1_45'
            php: 8.3
            experimental: false
          - mw: 'REL1_46'
            php: 8.4
            experimental: false
          - mw: 'REL1_47'
            php: 8.5
            experimental: false
          - mw: 'master'
            php: 8.5
            experimental: true

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mediawiki

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          tools: composer

      - name: Cache MediaWiki
        id: cache-mediawiki
        uses: actions/cache@v6
        with:
          path: mediawiki
          key: mw_${{ matrix.mw }}-php${{ matrix.php }}-v2

      - uses: actions/checkout@v7
        with:
          path: EarlyCopy

      - name: Install MediaWiki
        if: steps.cache-mediawiki.outputs.cache-hit != 'true'
        working-directory: ~
        run: bash EarlyCopy/.github/workflows/installWiki.sh ${{ matrix.mw }}

      - uses: actions/checkout@v7
        with:
          path: mediawiki/skins/Medik

      - name: Run PHPUnit
        run: |
          if [ -f tests/phpunit/phpunit.php ]; then
            php tests/phpunit/phpunit.php --group skins-medik
          else
            # MW 1.46 and later
            composer phpunit:config
            vendor/bin/phpunit --group skins-medik
          fi
